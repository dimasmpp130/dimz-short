<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fb" />
    <meta name="description" content="Security verification" />
    <title>Security Verification - DIMZ/SHORT</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon/logo-180x180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon/logo-192x192.png" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <style>
      body {
        min-height: 100vh
      }

      .verify-center {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px
      }

      .verify-card {
        width: min(100%, 430px);
        text-align: center
      }

      .verify-icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 18px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: var(--primary-soft, #eef2ff);
        color: var(--primary, #4f46e5);
        font-size: 24px
      }

      .verify-title {
        margin: 0 0 8px
      }

      .verify-message {
        margin: 0;
        color: var(--muted);
        line-height: 1.6
      }

      .turnstile-wrap {
        min-height: 65px;
        margin: 22px 0 12px;
        display: flex;
        justify-content: center
      }

      .verify-status {
        min-height: 22px;
        font-size: 13px;
        color: var(--muted)
      }

      .verify-status.error {
        color: var(--danger)
      }

      .verify-status.success {
        color: var(--success)
      }

      .verify-spinner {
        display: none;
        margin-top: 18px
      }

      .verify-spinner.show {
        display: block
      }
    </style>
  </head>
  <body>
    <main class="verify-center">
      <section class="card verify-card">
        <div class="verify-icon">✓</div>
        <h1 class="verify-title" id="verifyTitle"></h1>
        <p class="verify-message" id="verifyMessage"></p>
        <div class="turnstile-wrap" id="turnstileWrap"></div>
        <button id="createLinkBtn" type="button" disabled style="width:100%;margin:8px 0 14px;padding:12px 16px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-weight:700;opacity:.55;cursor:not-allowed"> <span data-i18n="btn_create_link">Create Link</span> </button>
        <div class="verify-spinner" id="verifySpinner"></div>
        <div class="verify-status" id="verifyStatus"></div>
      </section>
    </main>
    <script src="/js/i18n.js"></script>
    <script type="module" src="/js/verify.js"></script>
  </body>
</html>
